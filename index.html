function render(){

 nav.replaceChildren();detail.replaceChildren();document.querySelector('#count').textContent='메뉴 '+matches.length+'개';
 for(const f of matches){const a=element('a',f.name);a.href='#'+f.id;if(f===selected)a.setAttribute('aria-current','page');nav.append(a)}
 if(!selected){detail.append(element('p','검색된 메뉴가 없어. 다른 검색어를 입력해 줘.'));return}
 const f=selected;detail.append(element('small',f.category+' · '+f.source),element('h2',f.name),element('p',f.serving+' 기준'));
 if(f.image){const img=element('img','');img.src=f.image;img.alt=f.name+' 배식 예시';detail.append(img)}
 const dl=element('dl','');for(const [i,label] of ['열량','탄수화물','단백질','지방','당류','나트륨'].entries()){
 const n=f.values[i];dl.append(element('dt',label),element('dd',n==null?'미확인':n+' '+(i===0?'kcal':i===5?'mg':'g')))}
 detail.append(dl,element('small',f.note));}
function filter(){history.replaceState(null,'',location.href.split('#')[0]);render()}
query.oninput=filter;category.onchange=filter;window.onhashchange=render;render();
</script></html>
